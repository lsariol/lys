name: lys

services:
  lys:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: PROD
      COVE_URL: http://cove:2100
      COVE_TOKEN: ${LYS_COVE_TOKEN}
      NOTIFICATION_PORT: 2400
      SHARED_LYS_NOTIFICATION_TOKEN: ${SHARED_LYS_NOTIFICATION_TOKEN}
      SHARED_LYS_ENROLLMENT_TOKEN: ${SHARED_LYS_ENROLLMENT_TOKEN}
    container_name: lys
    # Only the spark network reaches the inlet and the enrollment API (http://lys:2400).
    expose:
      - "2400"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2400/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - spark


networks:
    spark:
        external: true